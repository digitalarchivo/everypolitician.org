name: Sync with main repo

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Sync from main repo
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_gh_token: ${{ secrets.GITHUB_TOKEN }}
          source_repo_path: YOUR_USERNAME/MAIN-REPO
          upstream_branch: main
          pr_labels: template_sync
          is_pr_cleanup: true
